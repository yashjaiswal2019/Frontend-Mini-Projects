<!DOCTYPE html>
<html lang="en">

<head>

    <title>Tic Tac Toe</title>
    <link rel="icon" href="tic-tac.png" type="img/X-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1 class="title">Tic Tac Toe</h1>
        <div class="container">
            <h2 class="player-turn">Now is <span>X</span>'s turn</h2>
            <div class="game-container">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
            <div class="winner-announce">winner</div>
            <button class="btn" id="new-game-btn">New Game</button>
            <button class="btn" id="reset-btn">Reset Game</button>
        </div>
        <script src="script.js"></script>
    </main>
