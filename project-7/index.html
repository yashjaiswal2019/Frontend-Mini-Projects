<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Papers Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 class="heading">Rock Papers Scissors</h1>

    <div class="choices-container">
        <div class="choice-card">
            <div class="choice rock" id="rock"></div>
            <h2>Rock</h2>
        </div>
        
        <div class="choice-card">
            <div class="choice paper" id="paper"></div>
            <h2>Paper</h2>
        </div>
        
        <div class="choice-card">
            <div class="choice scissor" id="scissor"></div>
            <h2>Scissor</h2>
        </div>
    </div>

    <div class="score-board">
        <div class="score">
            <h2>Your Score</h2>
            <p id="user-score">0</p>
        </div>

        <div class="score">
            <h2>Computer Score</h2>
            <p id="computer-score">0</p>
        </div>
    </div>

    <div class="msg-container">
        <h1>Please Choose Your input</h1>
        <p>Let's start the game</p>
    </div>
    <button class="btn" id="reset-btn">Reset Score</button>

    <h3 class="copyright">&copy;2026 Yash Jayasaval</h3>

    <script src="app.js"></script>
</body>

</html>
