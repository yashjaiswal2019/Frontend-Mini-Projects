<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" name="Yash Jayasaval">
    <meta name="description" content="Sliding and expanding Game Cards">
    <title>Game Cards</title>

    <link rel="icon" href="icon.png" type="img/png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <h1 class="header__h1">Gaming Animated Slide Cards</h1>
        <div class="header__list">
            <a href="#game-1">Game-1</a>
            <a href="#game-2">Game-2</a>
            <a href="#game-3">Game-3</a>
            <a href="#game-4">Game-4</a>
            <a href="#game-5">Game-5</a>
            <a href="#game-6">Game-6</a>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="card game-1" id="game-1">
                <h1 class="card__heading ">Red Dead Redemption 2</h1>
            </div>

            <div class="card game-2" id="game-2">
                <h1 class="card__heading ">Doom: The Dark Age</h1>
            </div>

            <div class="card game-3" id="game-3">
                <h1 class="card__heading ">Elden ring</h1>
            </div>

            <div class="card game-4" id="game-4">
                <h1 class="card__heading ">Ghost of Tsushima</h1>
            </div>

            <div class="card game-5" id="game-5">
                <h1 class="card__heading ">God of War-Ragnarok</h1>
            </div>

            <div class="card game-6" id="game-6">
                <h1 class="card__heading ">The Last of Us Part II</h1>
            </div>
        </div>
    </main>
</body>

</html>
